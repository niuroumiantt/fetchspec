<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 700" width="1480" height="700" role="img" aria-label="Fetchspec 在 inresearch.ai 中的流程：目标表和供应契约只读同步进 Fetchspec；Fetchspec 在 macmini 上完成产品地图、有界采集、原生提取、候选库、复核、绑定、打包与回执核验；包经 rsync 到 inresearch 接收，回执回到本地台账；目标行进入 delivered 需经人工登记交付指针并由作者用 deliveries import 写回 Git；深读与采用属研究侧。">
<style>
  :root { --bg:#fbfaf7; --fg:#1f2a24; --mute:#5b6b63; --lane:#f1efe8; --lanebd:#d9d5c8; --box:#ffffff; --boxbd:#7c8a82;
          --step:#eef4f1; --top:#f4f0e4; --carrier:#e9eef7; --low:#f6f1ec; --research:#ecece9; --accent:#1e6f5c; --warn:#fde8e6; --warnfg:#9b1c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161a18; --fg:#e6e9e4; --mute:#a5b0aa; --lane:#1f2522; --lanebd:#34403a; --box:#262d29; --boxbd:#8b9992;
            --step:#233029; --top:#2c2a21; --carrier:#232a36; --low:#2b2622; --research:#2a2a28; --accent:#6fc7ac; --warn:#4a1f1d; --warnfg:#ffb4ae; }
  }
  .bg { fill: var(--bg); }
  .lane { fill: var(--lane); stroke: var(--lanebd); }
  .lanet { fill: var(--fg); font: 600 13px system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .lanes { fill: var(--mute); font: 11px system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .box { fill: var(--box); stroke: var(--boxbd); stroke-width: 1.2; }
  .box.step { fill: var(--step); } .box.top { fill: var(--top); } .box.carrier { fill: var(--carrier); }
  .box.low { fill: var(--low); } .box.research { fill: var(--research); stroke-dasharray: 4 3; }
  .t1 { fill: var(--fg); font: 600 12.5px system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .t2 { fill: var(--mute); font: 11px ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", monospace; }
  .num { fill: var(--accent); } .numt { fill: #ffffff; font: 700 11px system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .edge { stroke: var(--fg); stroke-width: 1.3; } .edge.dashed { stroke-dasharray: 5 4; } .edge.accent { stroke: var(--accent); stroke-width: 1.8; }
  .lbl { fill: var(--mute); font: 10.5px system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; } .lbl.accent { fill: var(--accent); font-weight: 600; }
  .warn { fill: var(--warn); stroke: var(--warnfg); } .warnt { fill: var(--warnfg); font: 600 10.5px system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  #ah path { fill: var(--fg); }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1480" height="700"/><rect class="lane" x="16" y="16" width="1448" height="118" rx="8"/>
<text class="lanet" x="32" y="36">inresearch.ai · Git 权威</text>
<text class="lanes" x="1448" y="36" text-anchor="end">需求只从这里来；Fetchspec 只读，不写研究事实</text>
<rect class="lane" x="16" y="150" width="1448" height="292" rx="8"/>
<text class="lanet" x="32" y="170">Fetchspec · macmini（NVIDIA 批次在 M5）</text>
<text class="lanes" x="1448" y="170" text-anchor="end">python3 -m fetchspec.pipeline …  数据根 ~/.local/share/fetchspec/pipeline/</text>
<rect class="lane" x="16" y="458" width="1448" height="226" rx="8"/>
<text class="lanet" x="32" y="478">inresearch.ai · 接收侧（AWS / Spark 运行库）与作者 checkout</text>
<text class="lanes" x="1448" y="478" text-anchor="end">回执只记传输验收；目标行翻成 delivered 只认 Git 内载体</text>
<rect class="box top" x="40" y="52" width="200" height="74" rx="6"/>
<text class="t1" x="52" y="73">framework/tco_targets.json</text>
<text class="t2" x="52" y="95">team = fetchspec · 130 行</text>
<text class="t2" x="52" y="113">P.&lt;部件&gt;.spec/.operation·F.*</text>
<rect class="box top" x="280" y="52" width="200" height="74" rx="6"/>
<text class="t1" x="292" y="73">framework/supply_contract.json</text>
<text class="t2" x="292" y="95">1.6 · 交付契约 1.1</text>
<text class="t2" x="292" y="113">生成目标契约 2.0</text>
<rect class="box carrier" x="1000" y="52" width="200" height="74" rx="6"/>
<text class="t1" x="1012" y="73">data/event_cards.json</text>
<text class="t2" x="1012" y="95">target_id + origin_pointer</text>
<text class="t2" x="1012" y="113">Git 内载体（三种之一）</text>
<rect class="box carrier" x="1240" y="52" width="200" height="74" rx="6"/>
<text class="t1" x="1252" y="73">targets --refresh → PR</text>
<text class="t2" x="1252" y="95">needed → delivered</text>
<text class="t2" x="1252" y="113">delivered ≠ sourced</text>
<rect class="box step" x="40" y="214" width="200" height="74" rx="6"/>
<circle class="num" cx="56" cy="231" r="10"/>
<text class="numt" x="56" y="235" text-anchor="middle">1</text>
<text class="t1" x="72" y="235">sync-targets</text>
<text class="t2" x="52" y="257">快照契约 + 目标表</text>
<text class="t2" x="52" y="275">targets/snapshots/&lt;id&gt;/</text>
<rect class="box step" x="280" y="214" width="200" height="74" rx="6"/>
<circle class="num" cx="296" cy="231" r="10"/>
<text class="numt" x="296" y="235" text-anchor="middle">2</text>
<text class="t1" x="312" y="235">map-sync / map-ack</text>
<text class="t2" x="292" y="257">官方产品 sitemap 候选</text>
<text class="t2" x="292" y="275">lastmod 对账 · 人工确认</text>
<rect class="box step" x="520" y="214" width="200" height="74" rx="6"/>
<circle class="num" cx="536" cy="231" r="10"/>
<text class="numt" x="536" y="235" text-anchor="middle">3</text>
<text class="t1" x="552" y="235">collect</text>
<text class="t2" x="532" y="257">有界采集 --max-pages</text>
<text class="t2" x="532" y="275">robots · 节流 · ETag · CAS</text>
<rect class="box step" x="760" y="214" width="200" height="74" rx="6"/>
<circle class="num" cx="776" cy="231" r="10"/>
<text class="numt" x="776" y="235" text-anchor="middle">4</text>
<text class="t1" x="792" y="235">原生提取</text>
<text class="t2" x="772" y="257">HTML 表 → 原生 PDF → OOXML</text>
<text class="t2" x="772" y="275">不执行脚本 · 不猜 OCR</text>
<rect class="box step" x="1000" y="214" width="200" height="74" rx="6"/>
<circle class="num" cx="1016" cy="231" r="10"/>
<text class="numt" x="1016" y="235" text-anchor="middle">5</text>
<text class="t1" x="1032" y="235">候选库 catalog.sqlite3</text>
<text class="t2" x="1012" y="257">products·versions·sources</text>
<text class="t2" x="1012" y="275">spec_tables·cells·changes</text>
<rect class="box step" x="1000" y="344" width="200" height="74" rx="6"/>
<circle class="num" cx="1016" cy="361" r="10"/>
<text class="numt" x="1016" y="365" text-anchor="middle">6</text>
<text class="t1" x="1032" y="365">复核 list / export</text>
<text class="t2" x="1012" y="387">CSV：产品图 · 原单元格</text>
<text class="t2" x="1012" y="405">map-field 不改原值</text>
<rect class="box step" x="760" y="344" width="200" height="74" rx="6"/>
<circle class="num" cx="776" cy="361" r="10"/>
<text class="numt" x="776" y="365" text-anchor="middle">7</text>
<text class="t1" x="792" y="365">bind</text>
<text class="t2" x="772" y="387">产品 ID ↔ 目标行 ID + 理由</text>
<text class="t2" x="772" y="405">绑定属于某个目标快照</text>
<rect class="box step" x="520" y="344" width="200" height="74" rx="6"/>
<circle class="num" cx="536" cy="361" r="10"/>
<text class="numt" x="536" y="365" text-anchor="middle">8</text>
<text class="t1" x="552" y="365">package</text>
<text class="t2" x="532" y="387">v2.0 manifest + SHA256SUMS</text>
<text class="t2" x="532" y="405">target_ids·part_ids·files/</text>
<rect class="box step" x="280" y="344" width="200" height="74" rx="6"/>
<circle class="num" cx="296" cy="361" r="10"/>
<text class="numt" x="296" y="365" text-anchor="middle">9</text>
<text class="t1" x="312" y="365">receipt</text>
<text class="t2" x="292" y="387">回执核验回本地台账</text>
<text class="t2" x="292" y="405">packaged ≠ received</text>
<rect class="box step" x="40" y="344" width="200" height="74" rx="6"/>
<circle class="num" cx="56" cy="361" r="10"/>
<text class="numt" x="56" y="365" text-anchor="middle">10</text>
<text class="t1" x="72" y="365">author-proposal</text>
<text class="t2" x="52" y="387">可审核 JSON（不写上游）</text>
<text class="t2" x="52" y="405">records: target_id·sha·url</text>
<rect class="box low" x="40" y="500" width="200" height="74" rx="6"/>
<text class="t1" x="52" y="521">rsync 包目录</text>
<text class="t2" x="52" y="543">incoming/&lt;日期&gt;-fetchspec/</text>
<text class="t2" x="52" y="561">只传 package，不传台账</text>
<rect class="box low" x="280" y="500" width="200" height="74" rx="6"/>
<text class="t1" x="292" y="521">fetchspec-receive</text>
<text class="t2" x="292" y="543">校验路径 / 大小 / 逐文件 SHA</text>
<text class="t2" x="292" y="561">target_ids ∈ 当前目标表</text>
<rect class="box low" x="520" y="500" width="200" height="74" rx="6"/>
<text class="t1" x="532" y="521">运行库 receipts.json</text>
<text class="t2" x="532" y="543">originals/·product-library/</text>
<text class="t2" x="532" y="561">Reader 只收显式选定 SHA</text>
<rect class="box low" x="760" y="500" width="200" height="74" rx="6"/>
<text class="t1" x="772" y="521">register_delivery</text>
<text class="t2" x="772" y="543">target_id + evidence_path</text>
<text class="t2" x="772" y="561">写 data/assignments.json</text>
<rect class="box low" x="1000" y="500" width="200" height="74" rx="6"/>
<text class="t1" x="1012" y="521">deliveries import</text>
<text class="t2" x="1012" y="543">作者 checkout 读派工文件</text>
<text class="t2" x="1012" y="561">生成事件卡 · 幂等</text>
<rect class="box research" x="1000" y="610" width="200" height="74" rx="6"/>
<text class="t1" x="1012" y="631">Reader 深读 → 证据 → C3 采用</text>
<text class="t2" x="1012" y="653">→ status sourced</text>
<text class="t2" x="1012" y="671">研究侧流程，不属 Fetchspec</text>
<line class="edge" x1="140" y1="126" x2="140" y2="210" marker-end="url(#ah)"/>
<text class="lbl" x="150" y="182" text-anchor="start">只读 Git checkout；校验版本 / 形状 / SHA，拒绝非 Fetchspec 目标</text>
