<path class="edge dashed" d="M1465 528 L1465 546 L387 546 L387 531" fill="none" marker-end="url(#ah)"/>
<text class="lbl" x="795.0" y="541" text-anchor="middle">回流（未接）：哪些行仍缺、缺哪类出版方；本地先用 plan / coverage 顶上</text>
<text class="lanet" x="20" y="590">在哪台机器上跑</text>
<rect class="box machine" x="20.0" y="602" width="373.5" height="70" rx="6"/>
<text class="t1" x="32.0" y="624">macmini</text>
<text class="t2" x="32.0" y="646">采集执行机：目标表 host = macmini</text>
<text class="t2" x="32.0" y="664">原件与台账 ~/.local/share/fetchspec</text>
<rect class="box machine" x="415.5" y="602" width="373.5" height="70" rx="6"/>
<text class="t1" x="427.5" y="624">M5</text>
<text class="t2" x="427.5" y="646">开发与 NVIDIA 批次</text>
<text class="t2" x="427.5" y="664">可完整跑十个命令；装有历史目录</text>
<rect class="box machine" x="811.0" y="602" width="373.5" height="70" rx="6"/>
<text class="t1" x="823.0" y="624">AWS</text>
<text class="t2" x="823.0" y="646">inresearch 网站与接收端</text>
<text class="t2" x="823.0" y="664">运行库回执；不放规格原件长期档</text>
<rect class="box machine" x="1206.5" y="602" width="373.5" height="70" rx="6"/>
<text class="t1" x="1218.5" y="624">Spark</text>
<text class="t2" x="1218.5" y="646">永久原件归档与 Reader 深读</text>
<text class="t2" x="1218.5" y="664">不执行采集</text>
<text class="sub" x="20" y="698">命令都是 python3 -m fetchspec.pipeline &lt;命令&gt;。数据根 ~/.local/share/fetchspec/pipeline/；源码进 Git，原件、数据库、快照、包与回执都不进 Git。</text></svg>
