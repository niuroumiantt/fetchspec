<path class="edge" d="M620 418 L620 486 L140 486 L140 496" fill="none" marker-end="url(#ah)"/>
<text class="lbl" x="630" y="470" text-anchor="start">manifest.json + SHA256SUMS + files/（同 SHA 只存一份）</text>
<line class="edge" x1="240" y1="537" x2="276" y2="537" marker-end="url(#ah)"/>
<line class="edge" x1="480" y1="537" x2="516" y2="537" marker-end="url(#ah)"/>
<line class="edge" x1="720" y1="537" x2="756" y2="537" marker-end="url(#ah)"/>
<line class="edge" x1="960" y1="537" x2="996" y2="537" marker-end="url(#ah)"/>
<path class="edge" d="M680 500 L680 448 L380 448 L380 422" fill="none" marker-end="url(#ah)"/>
<text class="lbl" x="390" y="443" text-anchor="start">回执 JSON → receipt --input（按 --environment 隔离，本地验收 ≠ 生产接收）</text>
<path class="edge accent" d="M1200 537 L1220 537 L1220 150 L1100 150 L1100 130" fill="none" marker-end="url(#ah)"/>
<text class="lbl accent" x="1226" y="200" text-anchor="start">写回 Git</text>
<text class="lbl accent" x="1226" y="216" text-anchor="start">（作者 PR）</text>
<line class="edge" x1="1200" y1="89" x2="1236" y2="89" marker-end="url(#ah)"/>
<path class="edge dashed" d="M620 574 L620 647 L996 647" fill="none" marker-end="url(#ah)"/>
<text class="lbl" x="630" y="640" text-anchor="start">显式选定 SHA 才进 Reader；深读、证据、采用不由 Fetchspec 承担</text>
<path class="edge dashed" d="M140 418 L140 452 L24 452 L24 668 L860 668 L860 578" fill="none" marker-end="url(#ah)"/>
<text class="lbl" x="34" y="662" text-anchor="start">提案 records 逐条对应 register_delivery(target_id, evidence_path)：目前需人工搬运，尚无自动通道</text>
