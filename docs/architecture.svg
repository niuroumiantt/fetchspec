<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 712" width="1600" height="712" role="img" aria-label="Fetchspec 架构：inresearch 的目标表、供应契约和出版方登记只读同步进来；Fetchspec 分四段——需求（快照与采集计划）、爬取（官方来源到不可变字节）、整理（原表原值到参数观测与目标绑定）、输出（包、回执、登记）；包交给 inresearch 接收，回执回到本地台账，登记经作者 deliveries import 把目标行翻成 delivered，并回到下一轮需求。"><title>Fetchspec 架构（2026-09-30）：需求 → 爬取 → 整理 → 输出</title><style>:root{--bg:#fbfaf7;--fg:#1f2a24;--mute:#5b6b63;--box:#ffffff;--bd:#7c8a82;--step:#eef4f1;--head:#dcebe4;--up:#f4f0e4;--store:#f7f6f1;--machine:#eef0f5;--accent:#1e6f5c} @media (prefers-color-scheme: dark){:root{--bg:#161a18;--fg:#e6e9e4;--mute:#a5b0aa;--box:#262d29;--bd:#8b9992;--step:#233029;--head:#1f3a31;--up:#2c2a21;--store:#1d2220;--machine:#23262e;--accent:#6fc7ac}}
  .bg{fill:var(--bg)}
  .title{fill:var(--fg);font:700 18px 'PingFang SC','Noto Sans CJK SC','Noto Sans SC',system-ui,-apple-system,sans-serif} .sub{fill:var(--mute);font:12px 'PingFang SC','Noto Sans CJK SC','Noto Sans SC',system-ui,-apple-system,sans-serif}
  .lanet{fill:var(--fg);font:600 13px 'PingFang SC','Noto Sans CJK SC','Noto Sans SC',system-ui,-apple-system,sans-serif}
  .box{fill:var(--box);stroke:var(--bd);stroke-width:1.2} .box.step{fill:var(--step)} .box.up{fill:var(--up)} .box.machine{fill:var(--machine)}
  .head{fill:var(--head);stroke:var(--accent);stroke-width:1.4} .up{fill:var(--up);stroke:var(--bd);stroke-width:1.2}
  .store{fill:var(--store);stroke:var(--bd);stroke-width:1.1;stroke-dasharray:4 3}
  .t1{fill:var(--fg);font:600 13px 'PingFang SC','Noto Sans CJK SC','Noto Sans SC',system-ui,-apple-system,sans-serif} .t2{fill:var(--mute);font:11.5px 'PingFang SC','Noto Sans CJK SC','Noto Sans SC',system-ui,-apple-system,sans-serif}
  .num{fill:var(--accent)} .numt{fill:var(--bg);font:700 12px 'PingFang SC','Noto Sans CJK SC','Noto Sans SC',system-ui,-apple-system,sans-serif}
  .edge{stroke:var(--fg);stroke-width:1.3;fill:none} .edge.strong{stroke-width:2} .edge.dashed{stroke-dasharray:5 4;stroke:var(--mute)}
  .edge.accent{stroke:var(--accent);stroke-width:1.8}
  .lbl{fill:var(--mute);font:11px 'PingFang SC','Noto Sans CJK SC','Noto Sans SC',system-ui,-apple-system,sans-serif} .lbl.accent{fill:var(--accent);font-weight:600}
  #ah path{fill:var(--fg)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1600" height="712"/><text class="title" x="20" y="34">Fetchspec · 需求 → 爬取 → 整理 → 输出（2026-09-30）</text>
<text class="sub" x="20" y="56">inresearch.ai 六队之一，厂商规格队。只领 team = fetchspec 的目标行；只收英文中文官方来源；原值不改；目标是需求不是证据。实线已实现，虚线未接或需人工。</text>
<rect class="up" x="20" y="104" width="220" height="58" rx="6"/>
<text class="t1" x="32" y="126">inresearch.ai · 需求源</text>
<text class="t2" x="32" y="148">Git 权威，Fetchspec 只读</text>
<rect class="box up" x="20" y="176" width="220" height="76" rx="6"/>
<text class="t1" x="32" y="198">tco_targets.json</text>
<text class="t2" x="32" y="220">team = fetchspec 130 行</text>
<text class="t2" x="32" y="238">部件 × 数据类别 × 出版方</text>
<rect class="box up" x="20" y="266" width="220" height="76" rx="6"/>
<text class="t1" x="32" y="288">supply_contract.json</text>
<text class="t2" x="32" y="310">1.6 · 生成目标契约 2.0</text>
<text class="t2" x="32" y="328">parameter_observation_fields</text>
<rect class="box up" x="20" y="356" width="220" height="76" rx="6"/>
<text class="t1" x="32" y="378">part_fetch.json</text>
<text class="t2" x="32" y="400">每个部件的出版方实例</text>
<text class="t2" x="32" y="418">人工登记 → 目标行 instances</text>
<rect class="store up" x="20" y="452" width="220" height="76" rx="6"/>
<text class="t1" x="32" y="474">状态四态</text>
<text class="t2" x="32" y="496">needed → delivered → sourced</text>
<text class="t2" x="32" y="514">delivered 只认 Git 内载体</text>
<rect class="head" x="262" y="104" width="250" height="58" rx="6"/>
<circle class="num" cx="280" cy="122" r="11"/>
<text class="numt" x="280" y="126" text-anchor="middle">1</text>
<text class="t1" x="298" y="126">需求</text>
<text class="t2" x="274" y="148">目标行 → 采集计划</text>
<rect class="box step" x="262" y="176" width="250" height="76" rx="6"/>
<text class="t1" x="274" y="198">sync-targets</text>
<text class="t2" x="274" y="220">只读 Git 快照：commit + SHA</text>
<text class="t2" x="274" y="238">契约 1.5+ 1.x；越队与漂移拒绝</text>
<rect class="box step" x="262" y="266" width="250" height="76" rx="6"/>
<text class="t1" x="274" y="288">plan · coverage</text>
<text class="t2" x="274" y="310">下一步队列：在途 / 可抓 / 复核 / 缺适配器</text>
<text class="t2" x="274" y="328">按 next_due 与敏感度；附参数提示</text>
<rect class="box step" x="262" y="356" width="250" height="76" rx="6"/>
<text class="t1" x="274" y="378">适配器声明 profiles/*.json</text>
<text class="t2" x="274" y="400">target_parts：服务哪些部件</text>
<text class="t2" x="274" y="418">instance_aliases：对上目标行实例</text>
<rect class="store" x="262" y="452" width="250" height="76" rx="6"/>
<text class="t1" x="274" y="474">落盘</text>
<text class="t2" x="274" y="496">targets/snapshots/&lt;id&gt;/</text>
<text class="t2" x="274" y="514">targets/current.json</text>
<rect class="head" x="534" y="104" width="250" height="58" rx="6"/>
<circle class="num" cx="552" cy="122" r="11"/>
<text class="numt" x="552" y="126" text-anchor="middle">2</text>
<text class="t1" x="570" y="126">爬取</text>
<text class="t2" x="546" y="148">官方来源 → 不可变字节</text>
<rect class="box step" x="534" y="176" width="250" height="76" rx="6"/>
<text class="t1" x="546" y="198">map-sync · map-ack</text>
<text class="t2" x="546" y="220">官方产品 sitemap 只给候选</text>
<text class="t2" x="546" y="238">lastmod 变化待人工确认</text>
<rect class="box step" x="534" y="266" width="250" height="76" rx="6"/>
<text class="t1" x="546" y="288">collect</text>
<text class="t2" x="546" y="310">种子 + 请求预算；robots · 节流</text>
<text class="t2" x="546" y="328">ETag / Last-Modified + 内容 SHA</text>
<rect class="box step" x="534" y="356" width="250" height="76" rx="6"/>
<text class="t1" x="546" y="378">四个通道</text>
<text class="t2" x="546" y="400">产品页 · 文档 · 浏览器 · 人工</text>
<text class="t2" x="546" y="418">一个来源只属一个通道一台机</text>
<rect class="store" x="534" y="452" width="250" height="76" rx="6"/>
<text class="t1" x="546" y="474">落盘</text>
<text class="t2" x="546" y="496">blobs/&lt;sha&gt;（只增不改）</text>
<text class="t2" x="546" y="514">acquisition/&lt;公司&gt;/sources.sqlite3</text>
<rect class="head" x="806" y="104" width="250" height="58" rx="6"/>
<circle class="num" cx="824" cy="122" r="11"/>
<text class="numt" x="824" y="126" text-anchor="middle">3</text>
<text class="t1" x="842" y="126">整理</text>
<text class="t2" x="818" y="148">原表原值 → 参数观测</text>
<rect class="box step" x="806" y="176" width="250" height="76" rx="6"/>
<text class="t1" x="818" y="198">原生提取</text>
<text class="t2" x="818" y="220">HTML 表 → 原生 PDF → OOXML</text>
<text class="t2" x="818" y="238">不执行脚本；不用 OCR 猜值</text>
<rect class="box step" x="806" y="266" width="250" height="76" rx="6"/>
<text class="t1" x="818" y="288">候选库</text>
<text class="t2" x="818" y="310">公司 → 分类 → 系列 → 型号</text>
<text class="t2" x="818" y="328">原表 · 单元格 · 版本 · 变化</text>
<rect class="box step" x="806" y="356" width="250" height="76" rx="6"/>
<text class="t1" x="818" y="378">bind · map-field</text>
<text class="t2" x="818" y="400">产品 ↔ 目标行，写明理由</text>
<text class="t2" x="818" y="418">单元格 → 参数：原文 · 单位 · 条件</text>
<rect class="store" x="806" y="452" width="250" height="76" rx="6"/>
<text class="t1" x="818" y="474">落盘</text>
<text class="t2" x="818" y="496">products/catalog.sqlite3</text>
<text class="t2" x="818" y="514">export → CSV 供人抽查</text>
<rect class="head" x="1078" y="104" width="250" height="58" rx="6"/>
<circle class="num" cx="1096" cy="122" r="11"/>
<text class="numt" x="1096" y="126" text-anchor="middle">4</text>
<text class="t1" x="1114" y="126">输出</text>
<text class="t2" x="1090" y="148">一个包 · 一张回执 · 一份登记</text>
<rect class="box step" x="1078" y="176" width="250" height="76" rx="6"/>
<text class="t1" x="1090" y="198">package</text>
<text class="t2" x="1090" y="220">v2.0 manifest · SHA256SUMS · files/</text>
<text class="t2" x="1090" y="238">target_ids · 原表 · 参数观测</text>
<rect class="box step" x="1078" y="266" width="250" height="76" rx="6"/>
<text class="t1" x="1090" y="288">receipt</text>
<text class="t2" x="1090" y="310">接收端回执按环境入账</text>
<text class="t2" x="1090" y="328">packaged ≠ received</text>
<rect class="box step" x="1078" y="356" width="250" height="76" rx="6"/>
<text class="t1" x="1090" y="378">assignments</text>
<text class="t2" x="1090" y="400">deliveries import 的输入</text>
<text class="t2" x="1090" y="418">每目标行一条 · 官方 URL</text>
<rect class="store" x="1078" y="452" width="250" height="76" rx="6"/>
<text class="t1" x="1090" y="474">落盘</text>
<text class="t2" x="1090" y="496">deliveries/&lt;delivery_id&gt;/</text>
<text class="t2" x="1090" y="514">delivery-ledger.sqlite</text>
<rect class="up" x="1350" y="104" width="230" height="58" rx="6"/>
<text class="t1" x="1362" y="126">inresearch.ai · 接收与采用</text>
<text class="t2" x="1362" y="148">运行库与作者 checkout</text>
<rect class="box up" x="1350" y="176" width="230" height="76" rx="6"/>
<text class="t1" x="1362" y="198">fetchspec-receive</text>
<text class="t2" x="1362" y="220">逐文件 SHA；目标须属 fetchspec</text>
<text class="t2" x="1362" y="238">参数观测：只归档，未入库</text>
<rect class="box up" x="1350" y="266" width="230" height="76" rx="6"/>
<text class="t1" x="1362" y="288">研究采用</text>
<text class="t2" x="1362" y="310">Reader 深读 → 证据 → C3</text>
<text class="t2" x="1362" y="328">delivered → sourced</text>
<rect class="box up" x="1350" y="356" width="230" height="76" rx="6"/>
<text class="t1" x="1362" y="378">deliveries import</text>
<text class="t2" x="1362" y="400">作者 checkout → event_cards</text>
<text class="t2" x="1362" y="418">重跑目标表 · PR · 审阅</text>
<rect class="store up" x="1350" y="452" width="230" height="76" rx="6"/>
<text class="t1" x="1362" y="474">目标行翻状态</text>
<text class="t2" x="1362" y="496">needed → delivered（逐行）</text>
<text class="t2" x="1362" y="514">补丁待合：docs/upstream/</text>
